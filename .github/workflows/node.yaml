name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Prepare environment
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build and check types
        run: yarn build
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
